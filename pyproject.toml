[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mahak-api"
version = "0.1.0"
description = "MAHAK Application/API layer — holds the API boundary and shell-mode contract endpoint (R01)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]
auth = [
    "bcrypt>=4.3.0",
]
db = [
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
]
migrations = [
    "alembic>=1.14.0",
]
otp = [
    "phonenumbers>=8.13.0",
]
all = [
    "bcrypt>=4.3.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "phonenumbers>=8.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mahak_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
